<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INTERNET NEWS Next</title>
    <meta
      name="description"
      content="INTERNET NEWS Nextは、3〜5分で今日を理解するニュース体験を目指して開発中の独立ページです。"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="page-shell">
        <p class="eyebrow">INTERNET NEWS</p>
        <h1>INTERNET NEWS Next</h1>
      </div>
    </header>

    <main>
      <section class="hero" aria-labelledby="next-title">
        <div class="page-shell">
          <p class="status-label">現在開発中です</p>
          <h2 id="next-title">3〜5分で今日を理解するニュース体験</h2>
          <p class="hero-copy">
            INTERNET NEWS Nextは、Classicとは独立して開発されている次世代ページです。
          </p>
        </div>
      </section>

      <section class="status-section" aria-labelledby="next-status-title">
        <div class="page-shell">
          <h2 id="next-status-title">開発ステータス</h2>
          <ul class="status-list">
            <li>Classicの表示や挙動には影響しない独立構成です。</li>
            <li>現在は既存データや既存機能を変更していません。</li>
            <li>Next専用のHTML、CSS、JavaScriptだけで起動します。</li>
          </ul>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="page-shell">
        <p>INTERNET NEWS Next foundation</p>
      </div>
    </footer>
  </body>
</html>
