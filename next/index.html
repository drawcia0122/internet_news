<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INTERNET NEWS Next</title>
    <meta
      name="description"
      content="INTERNET NEWS Nextは、3〜5分で今日を理解するニュース体験を目指して開発中の独立ページです。"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="page-shell">
        <p class="eyebrow">INTERNET NEWS</p>
        <h1>INTERNET NEWS Next</h1>
      </div>
    </header>

    <main>
      <section class="hero" aria-labelledby="next-title">
        <div class="page-shell">
          <p class="status-label">現在は開発中です。</p>
          <h2 id="next-title">3〜5分で今日を理解するニュース体験</h2>
          <p class="hero-copy">
            重要な出来事、なぜ重要なのか、次に何を見るべきかを短時間で把握するためのNextホームMVPです。
          </p>
        </div>
      </section>

      <div class="page-shell home-layout">
        <div class="primary-column">
          <section class="section-block" aria-labelledby="key-points-title">
            <div class="section-heading">
              <div>
                <p class="section-kicker">First 30 seconds</p>
                <h2 id="key-points-title">今日の要点</h2>
              </div>
              <p class="section-meta" id="key-points-meta" aria-live="polite"></p>
            </div>
            <div
              class="key-point-grid"
              id="key-points-list"
              aria-busy="true"
              aria-live="polite"
            >
              <p class="section-state">今日の要点を読み込んでいます</p>
            </div>
          </section>

          <section class="section-block" aria-labelledby="must-know-title">
            <div class="section-heading">
              <div>
                <p class="section-kicker">Must know</p>
                <h2 id="must-know-title">今日絶対知るべきニュース</h2>
              </div>
              <p class="section-meta" id="must-know-meta" aria-live="polite"></p>
            </div>
            <div
              class="news-card-list"
              id="must-know-list"
              aria-busy="true"
              aria-live="polite"
            >
              <p class="section-state">必読ニュースを読み込んでいます</p>
            </div>
          </section>
        </div>

        <aside class="secondary-column" aria-label="補足情報">
          <section class="section-block compact-block" aria-labelledby="rising-words-title">
            <div class="section-heading">
              <div>
                <p class="section-kicker">Rising</p>
                <h2 id="rising-words-title">急上昇ワード</h2>
              </div>
              <p class="section-meta" id="trending-meta" aria-live="polite"></p>
            </div>
            <div
              class="trend-tag-list"
              id="trending-list"
              aria-busy="true"
              aria-live="polite"
            >
              <p class="section-state">急上昇ワードを読み込んでいます</p>
            </div>
          </section>

          <section class="section-block compact-block" aria-labelledby="continue-title">
            <div class="section-heading">
              <p class="section-kicker">Continue</p>
              <h2 id="continue-title">続きを見る</h2>
            </div>
            <div class="action-list">
              <button type="button">すべてのニュース</button>
              <button type="button">ゲーム</button>
              <button type="button">テック</button>
              <button type="button">エンタメ</button>
            </div>
          </section>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="page-shell">
        <p>INTERNET NEWS Next MVP</p>
      </div>
    </footer>
    <noscript>
      <p class="noscript-message">最新ニュースの表示にはJavaScriptが必要です。</p>
    </noscript>
  </body>
</html>
